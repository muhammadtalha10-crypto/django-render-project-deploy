<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Student</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (sirf icons ke liye) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ================= COLOR VARIABLES ================= */
        /* Home page wale hi colors, taake theme same rahe */
        :root {
            --c-primary: #6366f1;
            --c-primary-2: #8b5cf6;
            --c-accent: #06b6d4;
            --c-success: #10b981;
            --c-danger: #ef4444;
            --c-warning: #f59e0b;
            --c-dark: #0f172a;
            --c-text: #334155;
            --c-muted: #94a3b8;
            --grad-main: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --grad-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --grad-success: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --grad-secondary: linear-gradient(135deg, #64748b 0%, #334155 100%);
            --grad-warning: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            --shadow-soft: 0 10px 30px -10px rgba(99, 102, 241, .25);
            --shadow-hover: 0 20px 40px -12px rgba(99, 102, 241, .35);
        }

        /* ================= BODY / BACKGROUND ================= */
        /* Page ko center mein rakhne ke liye flex use kiya hai */
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--c-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, .18), transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(217, 70, 239, .15), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(6, 182, 212, .15), transparent 45%),
                #f1f5f9;
            background-attachment: fixed;
        }
        body > .container { width: 100%; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: var(--c-primary); border-radius: 10px; }
        ::selection { background: var(--c-primary); color: #fff; }

        /* ================= CARD ================= */
        .card {
            border: none !important;
            border-radius: 24px !important;
            overflow: hidden;
            background: rgba(255, 255, 255, .88);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow-soft) !important;
            transition: transform .3s ease, box-shadow .3s ease;
            animation: fadeUp .6s ease both;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover) !important;
        }

        /* Header: warning ko gradient diya aur pencil icon lagaya */
        .card-header {
            border: none !important;
            padding: 1.25rem 1.75rem;
            font-weight: 700;
            letter-spacing: .4px;
            font-size: 1.15rem;
            color: #fff;
            position: relative;
        }
        .card-header.bg-warning { background: var(--grad-warning) !important; }
        .card-header::before {
            content: "\F4CA"; /* pencil square icon */
            font-family: "bootstrap-icons";
            margin-right: 12px;
            background: rgba(255, 255, 255, .25);
            padding: 6px 10px;
            border-radius: 12px;
        }
        .card-body { padding: 2rem 1.75rem; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ================= FORM INPUTS ================= */
        .form-label {
            font-weight: 600;
            font-size: .85rem;
            color: var(--c-dark);
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-bottom: .4rem;
        }
        .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: .7rem 1rem;
            background-color: #f8fafc;
            transition: all .25s ease;
        }
        .form-control:hover { border-color: #fde68a; }
        .form-control:focus {
            border-color: var(--c-warning);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, .2);
            transform: translateY(-1px);
        }

        /* ================= BUTTONS ================= */
        .btn {
            border: none;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: .3px;
            padding: .65rem 1.5rem;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: all .3s ease;
        }
        .btn-success   { background: var(--grad-success); box-shadow: 0 8px 20px -6px rgba(16, 185, 129, .55); }
        .btn-secondary { background: var(--grad-secondary); box-shadow: 0 8px 20px -6px rgba(51, 65, 85, .5); }
        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            color: #fff;
            filter: brightness(1.08);
        }
        .btn:active { transform: translateY(0) scale(.97); }

        /* Shine effect buttons par */
        .btn::after {
            content: "";
            position: absolute;
            top: 0; left: -75%;
            width: 50%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-25deg);
            transition: left .6s ease;
        }
        .btn:hover::after { left: 130%; }
        a { text-decoration: none; }

        /* Mobile par thori spacing kam */
        @media (max-width: 576px) {
            .card-body { padding: 1.3rem; }
            .card-header { font-size: 1rem; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-header bg-warning">Update Student</div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" name="name" value="{{ student.name }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="number" name="roll_no" value="{{ student.roll_no }}" class="form-control" required>
                </div>

                <button class="btn btn-success" type="submit"><i class="bi bi-check2-circle me-1"></i> Save Changes</button>
                <a href="{% url 'home' %}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
